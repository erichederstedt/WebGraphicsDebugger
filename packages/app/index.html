<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Graphics Debugger</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app" data-stage="capture">
      <header class="topbar">
        <h1>Web Graphics Debugger</h1>
        <span id="capture-status"></span>
      </header>
      <main class="layout">
        <section class="scene-pane">
          <canvas id="gl-canvas" width="480" height="360"></canvas>
          <button id="capture-btn" class="capture-float">Capture Frame</button>
        </section>
        <section class="call-list-pane">
          <h2>Call List</h2>
          <div id="call-list" class="call-list"></div>
        </section>
        <section class="state-pane">
          <div class="preview-pane">
            <h2>Render Target</h2>
            <div id="render-preview" class="preview-body"></div>
          </div>
          <div class="state-block">
            <h2>GL State</h2>
            <div id="state-panel" class="state-panel"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
